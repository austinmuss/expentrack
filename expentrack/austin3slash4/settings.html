<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenTrack - Settings</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>
        <h1>ExpenTrack</h1>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="trackers.html">Expense Tracker</a></li>
                   <li><a href="summary.html">Summary</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contacts.html">Contact</a></li>
            <li><a href="settings.html">Settings</a></li>
        </ul>
    </nav>
</header>

<main class="page">

    <h2>Settings</h2>

    <!-- Account -->
    <section class="settings-card">

        <h3>Account</h3>

        <label for="name">Name</label>
        <input
            id="name"
            type="text"
            placeholder="Your name"
        >

        <label for="email">Email</label>
        <input
            id="email"
            type="email"
            placeholder="Your email"
        >

    </section>


    <!-- Currency -->
    <section class="settings-card">

        <h3>Currency</h3>

        <select id="currency">

            <option value="USD">USD - $</option>
            <option value="EUR">EUR - €</option>
            <option value="GBP">GBP - £</option>
            <option value="THB">THB - ฿</option>
            <option value="JPY">JPY - ¥</option>

        </select>

    </section>


    <!-- Preferences -->
    <section class="settings-card">

        <h3>Preferences</h3>

        <label class="checkbox-label">

            <input
                type="checkbox"
                id="notifications"
            >

            <span>Enable notifications</span>

        </label>


        <label class="checkbox-label">

            <input
                type="checkbox"
                id="dark-mode"
            >

            <span>Light mode</span>

        </label>

    </section>


    <button
        class="btn"
        id="save-settings"
        type="button"
    >
        Save Settings
    </button>

    <p
        id="settings-message"
        aria-live="polite"
    ></p>

</main>


<footer>
    <p>ExpenTrack</p>
</footer>


<script>

   
    const nameInput =
        document.getElementById("name");

    const emailInput =
        document.getElementById("email");

    const currencyInput =
        document.getElementById("currency");

    const notificationsInput =
        document.getElementById("notifications");

    const darkModeInput =
        document.getElementById("dark-mode");

    const saveButton =
        document.getElementById("save-settings");

    const settingsMessage =
        document.getElementById("settings-message");


 
    function loadSettings() {

        const savedName =
            localStorage.getItem("expenseName");

        const savedEmail =
            localStorage.getItem("expenseEmail");

        const savedCurrency =
            localStorage.getItem("expenseCurrency");

        const savedNotifications =
            localStorage.getItem("expenseNotifications");

        const savedDarkMode =
            localStorage.getItem("expenseDarkMode");


        if (savedName) {
            nameInput.value = savedName;
        }

        if (savedEmail) {
            emailInput.value = savedEmail;
        }

        if (savedCurrency) {
            currencyInput.value = savedCurrency;
        }

        if (savedNotifications === "true") {
            notificationsInput.checked = true;
        }

        if (savedDarkMode === "true") {
            darkModeInput.checked = true;
            document.body.classList.add("light-mode");
        }
    }


   
    saveButton.addEventListener(
        "click",
        () => {

            localStorage.setItem(
                "expenseName",
                nameInput.value.trim()
            );

            localStorage.setItem(
                "expenseEmail",
                emailInput.value.trim()
            );

            localStorage.setItem(
                "expenseCurrency",
                currencyInput.value
            );

            localStorage.setItem(
                "expenseNotifications",
                notificationsInput.checked
            );

            localStorage.setItem(
                "expenseDarkMode",
                darkModeInput.checked
            );


            /* Apply dark/light mode */

            if (darkModeInput.checked) {

                document.body.classList.add(
                    "light-mode"
                );

            } else {

                document.body.classList.remove(
                    "light-mode"
                );
            }


            settingsMessage.textContent =
                "Settings saved successfully!";

            settingsMessage.className =
                "success-message";


            setTimeout(() => {

                settingsMessage.textContent = "";

            }, 3000);

        }
    );


   
    loadSettings();

</script>

</body>
</html>
